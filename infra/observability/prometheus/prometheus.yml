# V2 A12.5.1: LOCAL development Prometheus. Not production configuration (production placement is A12.10, decision D2).
# Started only through the opt-in overlay `docker-compose.observability.yml`; see docs/runbooks/local-observability.md.
#
# Targets are the eight Core services' kit metrics listeners (`METRICS_PORT` 9464) and, since A12.5.2, the RabbitMQ broker's native
# endpoint (15692) and, since A12.5.3, postgres-exporter (9187), all on the Compose network. None is published to the host. One job
# per service: `nawara_service_info{service}` is the only metric that names its service, so a series is identified by its `job` and
# `instance`. No relabelling adds labels, and nothing here holds a credential.
#
# Another workload (for example `nawara-ia` or a product) is added later as its own job pointing at its own metrics endpoint.
# Its code never comes into this repository.
#
# V2 A12.6.3: Prometheus also evaluates the LOCAL alert rules (rule_files below) and scrapes a narrow allowlist of its own metrics
# (job `prometheus`). There is no `alerting:` block: Alertmanager is deferred (D6a), so alerts are read in the Prometheus UI and Grafana.
global:
  # Local development, not live monitoring: a 30 s interval keeps eight targets cheap, with 10 s to answer.
  scrape_interval: 30s
  scrape_timeout: 10s
  # Rule evaluation (A12.6.3) at the scrape interval.
  evaluation_interval: 30s

# V2 A12.6.3: the alert rules, mounted read-only from infra/observability/prometheus/rules. Their promtool tests live in
# infra/observability/prometheus/tests, which is never mounted.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:9464']
  - job_name: billing-service
    static_configs:
      - targets: ['billing-service:9464']
  - job_name: payment-service
    static_configs:
      - targets: ['payment-service:9464']
  - job_name: organization-service
    static_configs:
      - targets: ['organization-service:9464']
  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:9464']
  - job_name: file-service
    static_configs:
      - targets: ['file-service:9464']
  - job_name: audit-service
    static_configs:
      - targets: ['audit-service:9464']
  - job_name: release-service
    static_configs:
      - targets: ['release-service:9464']

  # V2 A12.5.2: the broker itself, through RabbitMQ's native `rabbitmq_prometheus` plugin. The local image already enables it; it listens
  # on 15692 inside the Compose network only (never published). `/metrics` is the AGGREGATED endpoint: node-level totals, without
  # per-queue, per-connection or per-channel labels, so its series count does not grow with the number of queues or clients.
  # Application-side messaging metrics stay with the services (A12.3). No credential: the endpoint needs none, and it is reachable only
  # from this network.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
    # Of the ~2,150 aggregated series, ~1,880 are Erlang VM internals: per-allocator memory detail and scheduler micro-state accounting.
    # Their count is fixed by the VM, but no A12.5 / A12.6 signal needs them, so they are dropped here (names are never rewritten).
    # The broker's own families and `erlang_vm_memory_*` are kept.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'erlang_vm_allocators|erlang_vm_msacc_.+'
        action: drop

  # V2 A12.5.3: PostgreSQL server-side metrics through postgres_exporter (9187, Compose network only). It connects as observability_monitor
  # (pg_monitor) to the `postgres` maintenance database: server-wide and per-database statistics for the one shared server, with no
  # per-table or per-index series and no query text. The application pool metrics (nawara_db_pool_*) stay with the services.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # V2 A12.6.3: Prometheus itself, on its own port inside its container (nothing new is published). Only what the Prometheus alerts and
  # the rule-health evidence need is kept: configuration reload state, rule evaluation failures, last evaluation and missed iterations
  # per rule group (`rule_group` = "<rule file>;<group>", bounded by the repository's groups), process start and memory, and the head
  # series count. Everything else (Go runtime, HTTP handlers, service discovery, notifications, TSDB internals) is dropped. Prometheus
  # still writes `up` and the scrape_* series for this job (metric relabelling does not apply to them).
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'prometheus_config_last_reload_successful|prometheus_config_last_reload_success_timestamp_seconds|prometheus_rule_evaluation_failures_total|prometheus_rule_group_last_evaluation_timestamp_seconds|prometheus_rule_group_iterations_missed_total|process_start_time_seconds|process_resident_memory_bytes|prometheus_tsdb_head_series'
        action: keep
