name: auth-service Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/auth-service/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-service-docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/auth-service/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-service-docker-build.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-core-auth-service

jobs:
  build-develop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:latest

  # Deploys :production to the same VPS nawara-drive uses, over SSH, routed through the
  # existing Traefik proxy on the deploy_edge network. The container's PostgreSQL, env file
  # (secrets generated on the server, never in GitHub) and migrations are handled by
  # apps/auth-service/deploy/provision-and-deploy.sh, shipped inside the image.
  # Reuses the same DEPLOY_SSH_* secrets nawara-drive's repo has (same VPS) — must be added to this repo separately, since
  # GitHub secrets don't cross repos. Routed at core-api.hsalem-anwar.dev/auth — a single
  # domain shared by every nawara-core service, path-routed per service via Traefik
  # PathPrefix rules (notification-service, payment-service, ai-service can be added the
  # same way later, each with their own PathPrefix).
  deploy-production:
    needs: build-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --entrypoint cat "$IMAGE" deploy/provision-and-deploy.sh | IMAGE="$IMAGE" bash -s
            docker logout ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_NAME }}:production
