name: auth-service Docker build

# V2 A14 (D3): pull requests never publish. A PR is validated by Core CI (`core image (auth-service)`: built and smoke-checked, never
# pushed); only a merge to main publishes, in build-image below, with its provenance attestation and SBOM.
on:
  push:
    branches: [main]
    paths:
      - 'apps/auth-service/**'
      # The image builds and ships @nawara/service-kit (Stage 13.2 dependency): a kit change changes the Auth image.
      - 'libs/service-kit/**'
      # The image also builds and ships @nawara/audit-contract; .dockerignore defines the build context (V2 A0).
      - 'libs/audit-contract/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/auth-service-docker-build.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-core-auth-service

jobs:
  # BUILD ONLY (V2-A.2): a merge to main builds one revision-labelled image, records its index digest and STOPS. It never deploys,
  # never touches the server and never moves :production or :latest (both are frozen and deprecated). Production changes only through
  # an explicit, owner-authorized auth-service-deploy.yml run that deploys an exact digest built here. This job is deliberately NOT in
  # the production-deploy-core-api queue: it changes nothing in production and must never supersede a pending production operation.
  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # V2 A14: the GitHub artifact attestation (keyless Sigstore signing over the OIDC token, stored in the attestations API).
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          # Provenance stays on, so the push is an image INDEX and outputs.digest is the INDEX digest: the deployment authority.
          # V2 A14: full BuildKit provenance, and an SPDX SBOM from a digest-pinned generator; both live in the index, so the index
          # digest (the attestation subject below) covers them.
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: record the artifact (not deployed)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the build reported no index digest" >&2; exit 1; }
          {
            echo "### auth-service image built (NOT deployed)"
            echo ""
            echo "- revision: \`$GITHUB_SHA\`"
            echo "- tag: \`$TAG\`"
            echo "- index digest: \`$DIGEST\`"
            echo ""
            echo "Production is unchanged. Deploying this exact artifact needs an explicit, owner-authorized run of auth-service-deploy.yml:"
            echo ""
            echo "\`gh workflow run auth-service-deploy.yml --ref main -f digest=$DIGEST -f confirm='deploy auth-service'\`"
          } >>"$GITHUB_STEP_SUMMARY"
      # V2 A14: the trusted provenance. Signed (keyless) for the exact INDEX digest, by this workflow on refs/heads/main; the deploy
      # verifier requires it (gh attestation verify). Also stored next to the image in GHCR.
      - name: attest the build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
