name: auth-service manual deploy

# Builds the selected ref and deploys it to the VPS (PostgreSQL + auth-service behind Traefik at
# core-api.hsalem-anwar.dev/auth) via apps/auth-service/deploy/provision-and-deploy.sh.
# Run from any branch:  gh workflow run auth-service-deploy.yml --ref <branch>
# Secrets: the org-level DEPLOY_SSH_* (same as the main-push deploy). Application secrets are NOT
# stored in GitHub — the script generates them on the server on first run (see the script header).

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-core-auth-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --entrypoint cat "$IMAGE" deploy/provision-and-deploy.sh | IMAGE="$IMAGE" bash -s
            docker logout ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
