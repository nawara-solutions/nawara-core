name: core RabbitMQ provision

# Provisions / converges the Core V1 production broker on the VPS (ADR-0053) via infra/rabbitmq/provision.sh: one private RabbitMQ node
# on the internal Core network, a named volume, no published port, no management UI, no guest, one least-privilege identity per service.
# MANUAL (workflow_dispatch) and `main` only:  gh workflow run core-rabbitmq-provision.yml --ref main -f services="audit-service auth-service"
# Idempotent: re-running never recreates the broker, never rotates a stored secret and never prints one. Broker secrets are generated on
# the server and never stored in GitHub. The production order is in docs/runbooks/core-rabbitmq-production.md (audit-service before Auth).
on:
  workflow_dispatch:
    inputs:
      services:
        description: Broker identities to converge (space-separated; the script refuses a service with no defined identity)
        required: true
        default: audit-service auth-service

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    # V2-A.3 / A3.5: the protected environment. A required reviewer approves before this job starts; DEPLOY_SSH_* are its secrets.
    environment: production
    # The same production queue as every Core deployment: never concurrent with a deploy, never cancelled once running.
    concurrency:
      group: production-deploy-core-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script is not in any image: it travels base64-encoded through the SSH environment (no scp, no secret involved).
      - name: Package the provisioning script
        run: echo "PROVISION_B64=$(base64 -w0 infra/rabbitmq/provision.sh)" >> "$GITHUB_ENV"
      # V2-A.3 A3.6: the production host key is pinned. An empty fingerprint would make the SSH action accept ANY host key, so the run
      # stops here, before any connection, until DEPLOY_SSH_FINGERPRINT holds the SHA256 fingerprint of the key the server negotiates.
      - name: Require the pinned production host key
        env:
          DEPLOY_SSH_FINGERPRINT: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
        run: |
          [[ $DEPLOY_SSH_FINGERPRINT =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] \
            || { echo "::error::DEPLOY_SSH_FINGERPRINT is missing or is not a SHA256 host-key fingerprint; nothing was sent to the server"; exit 1; }
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: PROVISION_B64,RABBITMQ_SERVICES
          script: |
            set -euo pipefail
            printf '%s' "$PROVISION_B64" | base64 -d | RABBITMQ_SERVICES="$RABBITMQ_SERVICES" bash -s
        env:
          RABBITMQ_SERVICES: ${{ inputs.services }}
