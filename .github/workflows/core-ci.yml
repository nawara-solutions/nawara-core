name: Core CI

# Validates every Node workspace: lint, typecheck, unit tests, integration tests, build; plus the repository's static
# safety and architecture checks. It builds and tests only: it never deploys, publishes an image or touches production.
# Covered:      auth-service, notification-service, file-service, payment-service, billing-service, organization-service, service-kit (Node), repository checks.
#               Production images of auth/organization/billing/payment-service are built and smoke-checked (job `images`), never pushed.
# NOT covered:  ai-service (Python) has no CI job yet.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref supersedes an older CI run. (Production DEPLOYMENT is different and is never cancelled.)
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Node version the SERVICES run on: it matches the production image (node:22-alpine in apps/auth-service/Dockerfile).
  # The setup-node ACTION itself runs on Node 24 (v7).
  NODE_VERSION: '22'

jobs:
  repo-checks:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: workflow safety and architecture checks
        run: npm run check:repo
      - name: checks' own tests
        run: npm run test:repo

  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-kit
            workspace: '@nawara/service-kit'
            integration: test:integration
          - name: auth-service
            workspace: auth-service
            integration: test:e2e
            database-tests: true
          - name: payment-service
            workspace: payment-service
            integration: test:e2e
            database-tests: true
          - name: notification-service
            workspace: notification-service
            integration: test:e2e
          - name: file-service
            workspace: file-service
            integration: test:e2e
            object-storage: true
          - name: billing-service
            workspace: billing-service
            integration: test:e2e
            database-tests: true
          - name: organization-service
            workspace: organization-service
            integration: test:e2e
            database-tests: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # Integration suites FAIL (never skip) in CI when a service they need is missing.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:pw@localhost:5432/postgres
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Services that depend on the kit consume its built output, so it is built first.
      - name: build the service-kit
        run: npm run build -w @nawara/service-kit
      - name: lint
        run: npm run lint -w ${{ matrix.workspace }}
      - name: typecheck
        run: npm run typecheck -w ${{ matrix.workspace }}
      - name: unit tests
        run: npm test -w ${{ matrix.workspace }}
      # Stage 17.4: an S3-protocol TEST server for the file-service S3 adapter suites (VersityGW, pinned; test infrastructure, not a
      # production provider choice). Credentials are random per run; nothing external, no cloud account.
      - name: start the S3-compatible test server
        if: matrix.object-storage
        run: |
          key="ci$(openssl rand -hex 8)"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          docker run -d --name s3-test -p 127.0.0.1:9000:7070 -e ROOT_ACCESS_KEY="$key" -e ROOT_SECRET_KEY="$secret" --tmpfs /data versity/versitygw:v1.8.0 posix /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          { echo "TEST_S3_ENDPOINT=http://127.0.0.1:9000"; echo "TEST_S3_ACCESS_KEY_ID=$key"; echo "TEST_S3_SECRET_ACCESS_KEY=$secret"; } >> "$GITHUB_ENV"
      - name: integration tests
        run: npm run ${{ matrix.integration }} -w ${{ matrix.workspace }}
      - name: database invariant tests
        if: matrix.database-tests
        run: npm run test:db -w ${{ matrix.workspace }}
      - name: build
        run: npm run build -w ${{ matrix.workspace }}

  # Stage 14.2: every deployable Core service image must build from a clean context and boot. A Dockerfile, a missing
  # workspace package (the Stage 13.2 regression: Auth imported @nawara/service-kit its image never provided), a compile
  # error, a runtime crash, a root user or a dead /health fails this job. It builds locally and never pushes an image;
  # publishing and deploying stay in auth-service-docker-build.yml. notification-service is covered since its Stage 16.3 foundation and file-service since its Stage 17.2 foundation;
  # ai-service is a scaffold, not a deployable Core service, and is deliberately not covered.
  images:
    name: core image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, organization-service, billing-service, payment-service, notification-service, file-service]
    services:
      # billing-service's event consumer attaches at startup in production, so the smoke needs a reachable broker.
      # PostgreSQL is deliberately absent: /health is process liveness and must not depend on it (/ready may answer 503).
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: build the production image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t nawara-core/${{ matrix.service }}:ci .
      - name: smoke-check the image (non-root, boots with production configuration, /health stays 200)
        run: bash scripts/smoke-core-image.sh ${{ matrix.service }} nawara-core/${{ matrix.service }}:ci

  infra:
    name: local infrastructure (least-privilege roles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @nawara/service-kit
      - name: start PostgreSQL with the per-service databases and roles
        run: |
          cp .env.example .env
          docker compose --profile db up -d --wait postgres
      - name: verify least privilege, including the kit migrations under the runtime role
        run: bash infra/postgres/verify.sh --with-kit-migrations

  e2e-real-broker:
    name: Real RabbitMQ loops (Billing/Payment Stage 4, Auth to Notification Stage 16.5)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:pw@localhost:5432/postgres
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # This suite spawns billing-service and payment-service as separate OS processes from their OWN built
      # `dist/main.js` (never one service's TypeScript imported into the other's test — see `scripts/lib/checks.mjs`),
      # talking only over real HTTP and the real broker, so both must be built first.
      - name: build service-kit, billing-service, payment-service, auth-service, notification-service
        run: npm run build -w @nawara/service-kit -w billing-service -w payment-service -w auth-service -w notification-service
      - name: real-broker E2E
        run: npm run test:e2e -w @nawara/e2e-real-broker

  e2e-auth-organization:
    name: Stage 10.1 Auth/Organization human-admin wire contract over real HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # This suite spawns auth-service and organization-service as separate OS processes from their OWN built
      # `dist/main.js` (never one service's TypeScript imported into the other's test — see `scripts/lib/checks.mjs`),
      # talking only over real HTTP, so both must be built first.
      - name: build service-kit, auth-service, organization-service
        run: npm run build -w @nawara/service-kit -w auth-service -w organization-service
      - name: Stage 10.1 Auth/Organization wire-contract E2E
        run: npm run test:e2e -w @nawara/e2e-auth-organization
