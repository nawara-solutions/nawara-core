name: core database backup

# Encrypted off-host backups of the cutover databases (Stage 21.x G5; ADR-0040 G5) via infra/backup/backup.sh: pg_dump -Fc inside each
# database container, encrypted on the server to the recipient CERTIFICATE (the private key never touches the server), uploaded to
# private S3-compatible storage, verified, 30 backup days kept. docs/runbooks/core-backup-restore.md.
#
# MANUAL ONLY (V2-A.3 / A3.5, owner decision B1):  gh workflow run core-backup.yml --ref main -f services="auth-service"
#   The job is bound to the protected `production` environment: a required reviewer approves each run before it starts.
# NO SCHEDULE: the former daily schedule (switched on by the repository variable CORE_BACKUP_SCHEDULE) is removed, because a nightly
#   run must not wait for a manual production approval. Scheduled backups return later through a separately reviewed
#   `production-backup` environment and job (which do not exist yet); enabling them stays G6-gated. CORE_BACKUP_SCHEDULE and
#   CORE_BACKUP_SERVICES are no longer read by this workflow.
# The script arrives base64-encoded through the SSH environment (no scp); the S3 credentials and the certificate live on the server,
# never in GitHub. A failed run is the failure signal (red in Actions; the server keeps backup/status/<service>.last-attempt).
on:
  workflow_dispatch:
    inputs:
      services:
        description: Services to back up (space-separated; any of organization-service, auth-service, audit-service)
        required: true
        default: auth-service

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    # V2-A.3 / A3.5: the protected environment. A required reviewer approves before this job starts; DEPLOY_SSH_* are its secrets.
    environment: production
    # The production queue: never concurrent with a deployment (no dump in the middle of a migration), never cancelled once running.
    concurrency:
      group: production-deploy-core-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package the backup script
        run: echo "BACKUP_B64=$(base64 -w0 infra/backup/backup.sh)" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: BACKUP_B64,BACKUP_SERVICES
          script: |
            set -euo pipefail
            printf '%s' "$BACKUP_B64" | base64 -d | BACKUP_SERVICES="$BACKUP_SERVICES" bash -s
        env:
          BACKUP_SERVICES: ${{ inputs.services }}
