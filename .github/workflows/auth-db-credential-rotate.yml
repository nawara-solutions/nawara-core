name: auth DB credential rotate (production security operation)

# PRODUCTION SECURITY OPERATION: rotates the password of Auth's runtime database role `auth_app` on the VPS, via
# apps/auth-service/deploy/rotate-db-credential.sh. Credential-only: it builds and pulls NO image, runs NO migration and does NOT deploy
# Auth; Auth is recreated from the image it is already running. The new password is generated on the server and never leaves it.
# MANUAL (workflow_dispatch) and `main` only, and you must type the confirmation:
#   gh workflow run auth-db-credential-rotate.yml --ref main -f confirm="rotate auth_app"
# Expect a short Auth maintenance window. Procedure and recovery: docs/runbooks/auth-db-credential-rotation.md
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type exactly "rotate auth_app" to rotate the production Auth runtime database password
        required: true

permissions:
  contents: read

jobs:
  rotate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'rotate auth_app'
    # The same production queue as every Core deployment: never concurrent with a deploy, a provisioning or another rotation, and never
    # cancelled once running (a half-finished rotation is resumed by re-running, never by cancelling).
    concurrency:
      group: production-deploy-core-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The script is not taken from any image (that would mean pulling the new Auth image): it travels base64-encoded through the SSH
      # environment. It carries no secret.
      - name: Package the rotation script
        run: echo "ROTATE_B64=$(base64 -w0 apps/auth-service/deploy/rotate-db-credential.sh)" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: ROTATE_B64
          script: |
            set -euo pipefail
            printf '%s' "$ROTATE_B64" | base64 -d | bash -s
