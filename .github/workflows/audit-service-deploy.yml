name: audit-service manual deploy

# audit-service: PostgreSQL + audit-service on the private Core network, no Traefik route, via
# apps/audit-service/deploy/provision-and-deploy.sh (ADR-0053). Requires the broker (core-rabbitmq-provision.yml) first: the deploy
# fails unless the audit queue, its dead-letter topology, the consumer and the binding exist; healthy means /ready (database,
# migrations, broker, ingestion consumer). audit-service must be deployed (and ready) BEFORE auth-service connects to the broker.
# Deploys ONE EXACT, ALREADY-BUILT audit-service image (V2 A0): the image comes from a build-image run of audit-service-image.yml, identified by its
# INDEX digest (shown in that run's summary). It NEVER builds. Deploying is an explicit, owner-authorized production mutation:
#   gh workflow run audit-service-deploy.yml --ref main -f digest=sha256:<64 hex> -f confirm='deploy audit-service'
# Two jobs, as for auth-service (docs/runbooks/digest-deployments.md):
#   verify  no environment, no production credentials: validates the digest, and the artifact must exist in the audit-service
#           repository, carry an org.opencontainers.image.revision label, and that revision must be an ancestor of main (an earlier
#           labelled main artifact may be redeployed; unlabelled legacy images, including those built before A0, are refused).
#   deploy  needs verify; bound to the protected `production` environment, so it WAITS for a required reviewer's approval and only
#           then receives the production SSH credentials (environment secrets). It deploys exactly IMAGE_NAME@digest; the deploy
#           script and the migrations then run FROM that image. The deploy job shares the production concurrency queue.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "audit-service image INDEX digest to deploy (sha256:<64 hex>, from a build-image run summary)"
        required: true
        type: string
      confirm:
        description: "Type exactly: deploy audit-service"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-core-audit-service

jobs:
  # Before any approval and without any production credential: a malformed or unverifiable digest is refused here, so nobody is ever
  # asked to approve it, and waiting for verification never holds the production queue.
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy audit-service'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # V2 A14: gh attestation verify reads this repository's attestations API (attestations:read, read-only).
      attestations: read
    outputs:
      revision: ${{ steps.artifact.outputs.revision }}
    steps:
      # Full history only for the ancestry check below; nothing is built from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pure input validation, before any network access: the digest reaches the shell only through the environment.
      - name: validate the digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "refused: the digest must be sha256:<64 lowercase hex>" >&2; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Read-only: the digest must exist in the audit-service repository and be a revision-labelled artifact built from main.
      - id: artifact
        name: verify the artifact
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REF" >/dev/null || { echo "refused: $REF does not exist in the audit-service repository" >&2; exit 1; }
          image=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}')
          # A single-platform index yields the image config itself; a multi-platform one a map keyed by platform.
          rev=$(jq -r 'if has("config") then (.config.Labels["org.opencontainers.image.revision"] // "")
                       else (.["linux/amd64"].config.Labels["org.opencontainers.image.revision"] // "") end' <<<"$image")
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "refused: no org.opencontainers.image.revision label (not a build-image artifact)" >&2; exit 1; }
          # V2 A14: the trusted provenance of THIS digest. The label is only an assertion: the signed (keyless) attestation must prove the
          # exact digest was built by audit-service-image.yml on refs/heads/main at that same commit, on a GitHub-hosted runner. No attestation, another
          # repository, workflow, ref or commit, another digest, or an unavailable service: refused (no bypass, no legacy exception).
          verified=$(gh attestation verify "oci://$REF" --repo nawara-solutions/nawara-core \
            --signer-workflow nawara-solutions/nawara-core/.github/workflows/audit-service-image.yml \
            --source-ref refs/heads/main --source-digest "$rev" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners --format json) \
            || { echo "refused: no trusted build provenance for $REF (built by audit-service-image.yml on refs/heads/main at $rev)" >&2; exit 1; }
          # Defence in depth over gh's own checks, on the fields gh documents as unforgeable (the certificate) and the signed subject.
          jq -e --arg d "${REF##*@sha256:}" --arg rev "$rev" \
            --arg signer "https://github.com/nawara-solutions/nawara-core/.github/workflows/audit-service-image.yml@refs/heads/main" '
            type == "array" and length >= 1 and all(.[];
              .verificationResult.statement.predicateType == "https://slsa.dev/provenance/v1"
              and ([.verificationResult.statement.subject[]?.digest.sha256] | index($d) != null)
              and (.verificationResult.signature.certificate as $c
                | $c.buildSignerURI == $signer and $c.sourceRepositoryURI == "https://github.com/nawara-solutions/nawara-core"
                and $c.sourceRepositoryRef == "refs/heads/main" and $c.sourceRepositoryDigest == $rev
                and $c.runnerEnvironment == "github-hosted"))' <<<"$verified" >/dev/null \
            || { echo "refused: the verified provenance does not describe $REF as required" >&2; exit 1; }
          git merge-base --is-ancestor "$rev" HEAD || { echo "refused: revision $rev is not an ancestor of main" >&2; exit 1; }
          echo "revision=$rev" >>"$GITHUB_OUTPUT"
          {
            echo "### audit-service deployment (verified; awaiting production approval)"
            echo ""
            echo "- index digest: \`${REF##*@}\`"
            echo "- revision: \`$rev\` (provenance verified: audit-service-image.yml@refs/heads/main)"
            echo "- main at dispatch: \`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy audit-service'
    # The protected environment: a required reviewer approves before this job starts; its DEPLOY_SSH_* are environment secrets.
    environment: production
    # Production deployments share ONE queue across every workflow. A running deployment is NEVER cancelled
    # (cancel-in-progress: false); a newer request waits its turn. GitHub keeps at most one waiting run per group.
    concurrency:
      group: production-deploy-core-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Defence in depth: the same input, re-checked locally before the production step (no network).
      - name: validate the digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "refused: the digest must be sha256:<64 lowercase hex>" >&2; exit 1; }
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            set -euo pipefail
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --entrypoint cat "$IMAGE" deploy/provision-and-deploy.sh | IMAGE="$IMAGE" bash -s
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # EXACTLY the selected (and verified) digest: never a tag, never a rebuild.
          IMAGE: ${{ env.IMAGE_NAME }}@${{ inputs.digest }}
