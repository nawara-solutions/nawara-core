# Local development infrastructure ONLY. Nothing here is production configuration and none of these credentials is a real secret.
#
#   cp .env.example .env
#   docker compose --profile db up -d --wait postgres rabbitmq   # infra first: PostgreSQL 16, one database per Core
#                                                                  # service (ADR-0032); RabbitMQ (ADR-0037)
#   docker compose --profile db run --rm auth-migrate             # apply each service's migrations ONCE, explicitly —
#   docker compose --profile db run --rm billing-service npm run migrate  # Compose never runs a migration at
#   docker compose --profile db run --rm payment-service npm run migrate  # container startup (see
#                                                                          # docs/architecture/production-readiness.md)
#   docker compose --profile db run --rm organization-service npm run migrate
#   docker compose --profile db up -d auth-service billing-service payment-service organization-service
#
# `--profile db` is required on every invocation that touches postgres or an app service (billing/payment/auth all
# `depends_on` it) — profile activation is per-invocation, not persistent. Every service runs alone with only the
# pieces it needs; nothing here couples services to each other at build time. Ports are bound to loopback so they
# are not reachable from the network.
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    profiles: [db]
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5433:5432' # 5433 so it does not clash with a PostgreSQL already on the host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy .env.example to .env}
      # Per-service roles (see infra/postgres/init). Values are read by the init script, only on first start of an empty volume.
      AUTH_MIGRATOR_PASSWORD: ${AUTH_MIGRATOR_PASSWORD:?copy .env.example to .env}
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD:?copy .env.example to .env}
      BILLING_MIGRATOR_PASSWORD: ${BILLING_MIGRATOR_PASSWORD:?copy .env.example to .env}
      BILLING_APP_PASSWORD: ${BILLING_APP_PASSWORD:?copy .env.example to .env}
      PAYMENT_MIGRATOR_PASSWORD: ${PAYMENT_MIGRATOR_PASSWORD:?copy .env.example to .env}
      PAYMENT_APP_PASSWORD: ${PAYMENT_APP_PASSWORD:?copy .env.example to .env}
      ACCOUNTING_MIGRATOR_PASSWORD: ${ACCOUNTING_MIGRATOR_PASSWORD:?copy .env.example to .env}
      ACCOUNTING_APP_PASSWORD: ${ACCOUNTING_APP_PASSWORD:?copy .env.example to .env}
      ORGANIZATION_MIGRATOR_PASSWORD: ${ORGANIZATION_MIGRATOR_PASSWORD:?copy .env.example to .env}
      ORGANIZATION_APP_PASSWORD: ${ORGANIZATION_APP_PASSWORD:?copy .env.example to .env}
    volumes:
      - nawara_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies auth-service's migrations (its own bespoke tracked-SQL mechanism, not the kit's `nawara-migrate` —
  # auth-service predates @nawara/service-kit and does not depend on it) to the shared postgres. Never runs at
  # container startup; an operator (or this Compose file's own usage comment) invokes it explicitly, exactly once
  # per empty database, mirroring production's "migrations are an explicit step" policy.
  auth-migrate:
    profiles: [db]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${AUTH_MIGRATOR_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./apps/auth-service/db/migrations:/migrations:ro
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        for f in /migrations/[0-9]*.sql; do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -h postgres -U auth_migrator -d auth -f "$$f"
        done

  auth-service:
    profiles: [db]
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://auth_app:${AUTH_APP_PASSWORD:?copy .env.example to .env}@postgres:5432/auth
      JWT_SECRET: ${AUTH_JWT_SECRET:?copy .env.example to .env}
      OPERATOR_CODE_PEPPER: ${AUTH_OPERATOR_CODE_PEPPER:?copy .env.example to .env}
      SECRET_KEY_PEPPER: ${AUTH_SECRET_KEY_PEPPER:?copy .env.example to .env}
      THROTTLE_KEY_PEPPER: ${AUTH_THROTTLE_KEY_PEPPER:?copy .env.example to .env}
      JOIN_CODE_PEPPER: ${AUTH_JOIN_CODE_PEPPER:?copy .env.example to .env}
      TOTP_ENCRYPTION_KEYS: k1:${AUTH_TOTP_KEY_K1:?copy .env.example to .env}
      TOTP_ENCRYPTION_ACTIVE_KEY_ID: k1
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/auth/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  billing-service:
    profiles: [db]
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://billing_app:${BILLING_APP_PASSWORD:?copy .env.example to .env}@postgres:5432/billing
      # Only used by `npm run migrate`, run explicitly (see this file's header comment) — never read at app startup.
      MIGRATION_DATABASE_URL: postgres://billing_migrator:${BILLING_MIGRATOR_PASSWORD:?copy .env.example to .env}@postgres:5432/billing
      AUTH_SERVICE_URL: http://auth-service:3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      BILLING_SUPPORTED_CURRENCIES: TND
      PAYMENT_SERVICE_URL: http://payment-service:3000
      PAYMENT_SERVICE_TOKEN: ${BILLING_TO_PAYMENT_TOKEN:?copy .env.example to .env}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    profiles: [db]
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://payment_app:${PAYMENT_APP_PASSWORD:?copy .env.example to .env}@postgres:5432/payment
      # Only used by `npm run migrate`, run explicitly (see this file's header comment) — never read at app startup.
      MIGRATION_DATABASE_URL: postgres://payment_migrator:${PAYMENT_MIGRATOR_PASSWORD:?copy .env.example to .env}@postgres:5432/payment
      AUTH_SERVICE_URL: http://auth-service:3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PAYMENT_SUPPORTED_CURRENCIES: TND
      # Dev-only test gateway adapter (refused when NODE_ENV=production): lets a payment settle locally with no
      # real provider credentials, so the Billing <-> Payment loop can be exercised end to end through Compose.
      PAYMENT_TEST_PROVIDER: 'true'
      SERVICE_TOKENS: billing-service:${BILLING_TO_PAYMENT_DIGEST:?copy .env.example to .env},auth-service:${AUTH_TO_PAYMENT_DIGEST:?copy .env.example to .env}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  # Implemented but NOT yet authoritative: auth-service still owns Company/Platform/Organization (ADR-0039). It depends on no
  # broker and has no outbound service token of its own. It DOES now carry one bounded, narrow Auth dependency (AUTH_SERVICE_URL,
  # ADR-0042 decision 6): the human-admin module forwards a caller's own bearer to Auth's /auth/grants and /auth/step-up/verify,
  # never a service credential, never anything outside that module. SERVICE_TOKENS is deliberately left empty here (every
  # service-token call is refused) because no caller is registered yet; to exercise it locally, generate a token with
  # generateServiceToken() and set SERVICE_TOKENS=<caller>:<digest> (see apps/organization-service/README.md).
  organization-service:
    profiles: [db]
    build:
      context: .
      dockerfile: apps/organization-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3003:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://organization_app:${ORGANIZATION_APP_PASSWORD:?copy .env.example to .env}@postgres:5432/organization
      # Only used by `npm run migrate`, run explicitly (see this file's header comment) — never read at app startup.
      MIGRATION_DATABASE_URL: postgres://organization_migrator:${ORGANIZATION_MIGRATOR_PASSWORD:?copy .env.example to .env}@postgres:5432/organization
      SERVICE_TOKENS: ${ORGANIZATION_SERVICE_TOKENS:-}
      # ADR-0042: every registered caller needs an explicit policy entry (capabilities and an explicit allowedPlatforms; no wildcard). The service
      # REFUSES TO START when a registered token has no entry. Empty with no tokens is the default: nothing can call it.
      SERVICE_POLICY: ${ORGANIZATION_SERVICE_POLICY:-}
      # ADR-0042 decision 6: used ONLY by the human-admin module, to forward a caller's own bearer to Auth (/auth/grants, /auth/step-up/verify).
      AUTH_SERVICE_URL: http://auth-service:3000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nawara_pgdata:
