# V2 A12.5.1: OPT-IN local observability overlay. LOCAL development only; nothing here is production configuration.
#
# Normal development uses docker-compose.yml alone: every Core service keeps the kit default METRICS_ENABLED=false (no metrics
# listener at all). Adding this file opts in. It turns on each Core service's metrics listener on the Compose network and starts
# Prometheus:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile db up -d --wait postgres rabbitmq
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile db up -d \
#     auth-service billing-service payment-service organization-service notification-service file-service audit-service \
#     release-service postgres-exporter prometheus grafana
#   open http://127.0.0.1:9090/targets      # Prometheus
#   open http://127.0.0.1:3100              # Grafana (admin / GRAFANA_ADMIN_PASSWORD from .env)
#
# Each listener binds 0.0.0.0:9464 INSIDE its container, so Prometheus can reach `<service>:9464`. It is never published to the
# host: only the application ports (unchanged), Prometheus (127.0.0.1:9090) and Grafana (127.0.0.1:3100, A12.6.1) are. See
# docs/runbooks/local-observability.md. Since A12.6.3 Prometheus evaluates the LOCAL alert rules and scrapes a narrow allowlist of its own
# metrics; Alertmanager is deferred until a concrete receiver exists. RabbitMQ broker metrics (A12.5.2) need no change here: the image already serves them
# on 15692 inside the network. PostgreSQL server metrics (A12.5.3) come from postgres-exporter, through a least-privilege role that the
# init script creates only when this file passes MONITORING_PASSWORD, i.e. when the local data volume is first initialised in this mode
# (for an existing volume, see docs/runbooks/local-observability.md).

x-core-metrics: &core-metrics
  METRICS_ENABLED: 'true'
  METRICS_HOST: 0.0.0.0
  METRICS_PORT: '9464'

services:
  # V2 A12.5.3: lets infra/postgres/init create the observability_monitor role (pg_monitor only) on a fresh volume.
  postgres:
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?copy .env.example to .env}

  auth-service:
    environment: *core-metrics
  billing-service:
    environment: *core-metrics
  payment-service:
    environment: *core-metrics
  organization-service:
    environment: *core-metrics
  notification-service:
    environment: *core-metrics
  file-service:
    environment: *core-metrics
  audit-service:
    environment: *core-metrics
  release-service:
    environment: *core-metrics

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    # The image's default flags, written out, plus a short local retention. No --web.enable-admin-api, no
    # --web.enable-lifecycle, no remote write.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=1GB
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # V2 A12.6.3: the alert rules only (read-only); their tests (infra/observability/prometheus/tests) are never mounted.
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - nawara_prometheus_data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  # V2 A12.5.3: PostgreSQL server metrics. Connects to the `postgres` maintenance database as observability_monitor (pg_monitor, no
  # service-database CONNECT, no write right) and serves 9187 on the Compose network only. Per-table / per-index collectors are off:
  # this exporter sees server-wide and per-database statistics only. No query text: stat_statements stays off (no pg_stat_statements).
  postgres-exporter:
    profiles: [db]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: observability_monitor
      DATA_SOURCE_PASS: ${MONITORING_PASSWORD:?copy .env.example to .env}
    command:
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
      - --no-collector.statio_user_indexes
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # V2 A12.6.1: LOCAL Grafana (OSS image), reading Prometheus only. Provisioned from the repository at every start: one datasource,
  # the "Nawara Core" folder and its dashboards. Runtime state (its SQLite database, sessions) lives in tmpfs and is lost on
  # recreation, which restores exactly the committed baseline. No anonymous access, no sign-up, no default admin password, no plugin
  # installation and no call home (usage reporting, update checks, news feed, Gravatar, feedback links, plugin preinstall / update).
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      GF_LOG_MODE: console
    # Only the two provisioning kinds used are mounted; the image's other (empty) provisioning directories stay as shipped.
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:uid=472,gid=0,mode=0770
      - /tmp:uid=472,gid=0,mode=0770
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  # Local, disposable time-series data (at most 3 days / 1 GB). Remove it with `docker volume rm` when no longer useful.
  nawara_prometheus_data:
